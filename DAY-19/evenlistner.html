<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Listener</title>
  </head>
  <body>
    <button id="btn">+</button>
    <input type="text" id="input" />

    <script>
      const btn = document.getElementById("btn");
      btn.addEventListener("click", () => {
        alert("Hello World");
      });
    </script>
  </body>
</html>
