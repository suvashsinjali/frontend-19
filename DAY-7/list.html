<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List</title>
    <style>
      nav {
        background-color: bisque;
        padding: 10px;
      }
      nav ul {
        display: flex;
        justify-content: center;
        gap: 20px;
        list-style: none;
      }
      ul > li a {
        /* display: block; */
        /* background-color: aqua; */
        text-decoration: none;
        /* padding: 10px; */
        /* box-shadow: 0px 5px 2px blue; */
      }
      /* ul > li a:hover {
        transform: translateY(-5px);
      }

      ul > li a:active {
        transform: translateX(-10px);
        transition: 10ms;
      } */

      li {
        position: relative;
      }

      li a::after {
        content: "";
        position: absolute;
        width: 0%;
        left: 0;
        bottom: -8px;
        background-color: white;
        height: 2px;
        /* border-bottom: 2px solid white; */
      }

      li a:hover {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">Contacts</a></li>
      </ul>
    </nav>
  </body>
</html>
