<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D card flip example</title>
    <style>
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #0f172a;
        font-family: sans-serif;
        color: white;
      }

      .container {
        perspective: 1000px;
      }

      .box {
        width: 200px;
        height: 200px;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
      }

      .container:hover .box {
        transform: rotateY(180deg) translateZ(150px);
      }

      .face {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        box-shadow: 0 10px 25px rgba(239, 236, 236, 0.5);
        backface-visibility: hidden;
      }

      .front {
        background: linear-gradient(135deg, #6366f1, #a855f7);
      }

      .back {
        background: linear-gradient(135deg, #ec4899, #f43f5e);
        transform: rotateY(180deg);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box box1">
        <div class="face front">
          <p>Hover Me</p>
          <small>Front</small>
        </div>

        <div class="face back">
          <p>Flipped</p>
          <small>Back</small>
        </div>
      </div>
    </div>
  </body>
</html>
