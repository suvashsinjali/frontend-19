<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Count Number</title>
    <style>
      .counter {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .button {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }
      h1 {
        font-size: 48px;
        font-family: monospace;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="counter">
      <div class="buttons counter">
        <button class="button" onclick="">-</button>
        <h1>0</h1>
        <button class="button" onclick="">+</button>
      </div>
    </div>

    <script>
      let count = 0;

      const counter = document.getElementById("counter");

      function increment() {
        count++;
        counter.textContent = count;
      }

      function decrement() {
        count--;
        if (count < 0) {
          count = 0;
        }
        counter.textContent = count;
      }
    </script>
  </body>
</html>
