<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #a6a6ed;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 300px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      background: #2b2b3d;
    }
    .display {
      width: 100%;
    }
    input {
      width: 100%;
      height: 60px;
      text-align: right;
      font-size: 28px;
      border: none;
      outline: none;
      padding: 0 16px;
      background: #2b2b3d;
      color: #fff;
    }
    input::placeholder {
      color: #888;
    }
    .buttons {
      display: grid;
      width: 100%;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: #3a3a4d;
    }
    .button {
      padding: 18px 10px;
      border: none;
      font-size: 20px;
      cursor: pointer;
      background: #2b2b3d;
      color: #fff;
      transition: background 0.15s ease;
    }
    .button:hover {
      background: #3a3a4d;
    }
    .button:active {
      background: #4a4a63;
    }
    .button:nth-child(17) {
      grid-column: span 2;
    }
    .button:nth-child(4),
    .button:nth-child(8),
    .button:nth-child(12),
    .button:nth-child(16) {
      background: #ff9f43;
    }
    .button:nth-child(4):hover,
    .button:nth-child(8):hover,
    .button:nth-child(12):hover,
    .button:nth-child(16):hover {
      background: #ffb066;
    }
    .button:nth-child(18) {
      background: #ff9f43;
    }
    .button:nth-child(18):hover {
      background: #ffb066;
    }
    .button:nth-child(1),
    .button:nth-child(2) {
      color: #ff6b6b;
    }
  </style>
  <body>
    <div class="container">
      <div class="display">
        <input type="text" placeholder="0" id="display" />
      </div>
      <div class="buttons">
        <button class="button">AC</button>
        <button class="button">DEL</button>
        <button class="button">%</button>
        <button class="button">/</button>
        <button class="button">7</button>
        <button class="button">8</button>
        <button class="button">9</button>
        <button class="button">*</button>
        <button class="button">4</button>
        <button class="button">5</button>
        <button class="button">6</button>
        <button class="button">-</button>
        <button class="button">1</button>
        <button class="button">2</button>
        <button class="button">3</button>
        <button class="button">+</button>
        <button class="button">0</button>
        <button class="button">.</button>
        <button class="button">=</button>
      </div>
    </div>
  </body>
  <script>
    const display = document.getElementById("display");
    const buttons = document.querySelectorAll(".button");
    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const value = button.textContent;
        if (value === "AC") {
          display.value = "";
        } else if (value === "DEL") {
          display.value = display.value.slice(0, -1);
        } else if (value === "=") {
          try {
            display.value = eval(display.value);
          } catch (error) {
            display.value = "Error";
          }
        } else {
          display.value += value;
        }
      });
    });
  </script>
</html>
