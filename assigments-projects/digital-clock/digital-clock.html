<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clock</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @font-face {
        font-family: "DSEG7 mini regular";
        src: url("./fonts/fonts-DSEG_v046/DSEG14-Modern-MINI/DSEG14ModernMini-bold.woff2")
          format("woff2");
        font-weight: bold;
      }

      @font-face {
        font-family: "DSEG-heading";
        src: url("./fonts/fonts-DSEG_v046/DSEG14-Classic/DSEG14Classic-Bold.woff2")
          format("woff2");
        font-weight: bold;
      }

      @theme {
        --font-dseg: "DSEG7 mini regular", monospace;
        --font-dseg-heading: "DSEG-heading", monospace;
      }
    </style>
  </head>
  <body class="bg-zinc-950 h-screen flex items-center justify-center">
    <div class="flex flex-col items-center gap-10">
      <h1 class="font-dseg-heading text-green-500 text-7xl">Digital clock</h1>
      <p id="time" class="text-amber-500 font-dseg flex gap-2 text-6xl"></p>
    </div>

    <script>
      const time = document.getElementById("time");

      function updateTime() {
        const date = new Date();
        let hours = date.getHours();
        let minutes = date.getMinutes();
        let seconds = date.getSeconds();

        const period = hours >= 12 ? "pm" : "am";

        hours = hours % 12 || 12;
        // hours = hours < 10 ? "0" + hours : hours;
        // minutes = minutes < 10 ? "0" + minutes : minutes;
        // seconds = seconds < 10 ? "0" + seconds : seconds;
        hours = String(hours).padStart(2, "0");
        minutes = String(minutes).padStart(2, "0");
        seconds = String(seconds).padStart(2, "0");
        time.textContent = `${hours}:${minutes}:${seconds} ${period}`;
      }

      updateTime();
      setInterval(updateTime, 1000);
    </script>
  </body>
</html>
