<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <style>
      :root {
        --ink: #1c1b1a;
        --paper: #fafaf8;
        --line: #e3e1dc;
        --accent: #3b5f4f;
        --accent-soft: #e7efe9;
        --muted: #8a877f;
        --danger: #a8433a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 64px 20px;
        background: var(--paper);
        font-family: "Iowan Old Style", "Georgia", serif;
        color: var(--ink);
      }

      .container {
        width: 100%;
        max-width: 440px;
      }

      h1 {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 4px;
      }

      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        color: var(--muted);
        margin: 0 0 28px;
      }

      .input-row {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
      }

      #todoInput {
        flex: 1;
        padding: 12px 14px;
        font-size: 15px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        outline: none;
        transition: border-color 0.15s ease;
      }

      #todoInput:focus {
        border-color: var(--accent);
      }

      #todoInput::placeholder {
        color: var(--muted);
      }

      #addButton {
        padding: 12px 20px;
        font-size: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }

      #addButton:hover {
        opacity: 0.88;
      }
      #addButton:active {
        opacity: 0.75;
      }
      #addButton:focus-visible,
      #todoInput:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      ul#todoList {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        animation: appear 0.18s ease;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .task-text {
        font-size: 15px;
        word-break: break-word;
      }

      .task-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }

      .task-time {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }

      .delete-btn {
        border: none;
        background: transparent;
        color: var(--danger);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        cursor: pointer;
        padding: 4px 6px;
        border-radius: 6px;
      }

      .delete-btn:hover {
        background: #f5e9e7;
      }

      .empty-state {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        color: var(--muted);
        text-align: center;
        padding: 32px 12px;
        border: 1px dashed var(--line);
        border-radius: 8px;
      }

      .storage-note {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 11px;
        color: var(--muted);
        margin-top: 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="contain
    
    er">
      <h1>Todo List</h1>
      <!-- <p class="subtitle">Add a task, check it off by deleting it when done.</p> -->
      <div class="input-row">
        <input
          type="text"
          id="todoInput"
          placeholder="Enter a task"
          autocomplete="off"
        />
        <button id="addButton">Add</button>
      </div>
      <ul id="todoList"></ul>
      <p class="storage-note">Tasks are kept in memory for this session.</p>
    </div>

    <script>
      let tasks = [];
      const todoInput = document.getElementById("todoInput");
      const addButton = document.getElementById("addButton");
      const todoList = document.getElementById("todoList");

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function addTask() {
        const task = todoInput.value.trim();
        if (!task) return;

        tasks.push({
          id: Date.now(),
          text: task,
          time: new Date().toLocaleString(),
        });

        todoInput.value = "";
        renderTasks();
        todoInput.focus();
      }

      function deleteTask(id) {
        tasks = tasks.filter((task) => task.id !== id);
        renderTasks();
      }

      function renderTasks() {
        if (tasks.length === 0) {
          todoList.innerHTML = `<li class="empty-state" style="border:1px dashed var(--line);">Nothing here yet — add your first task above.</li>`;
          return;
        }

        todoList.innerHTML = tasks
          .map(
            (item) => `
      <li>
        <span class="task-text">${escapeHtml(item.text)}</span>
        <span class="task-meta">
          <span class="task-time">${item.time}</span>
          <button class="delete-btn" data-id="${item.id}">Delete</button>
        </span>
      </li>
    `,
          )
          .join("");
      }

      addButton.addEventListener("click", addTask);

      todoInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") addTask();
      });

      todoList.addEventListener("click", function (e) {
        if (e.target.classList.contains("delete-btn")) {
          deleteTask(Number(e.target.dataset.id));
        }
      });

      renderTasks();
    </script>
  </body>
</html>
