<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TO-DO list</title>
  </head>
  <body>
    <div class="container">
      <h1>To-Do List</h1>

      <div class="input row">
        <input
          type="text"
          name="todoInput"
          id="todoInput"
          placeholder="Enter a task"
          autocomplete="off"
        />
        <button id="addButton">Add</button>
      </div>

      <ul id="todoList"></ul>
    </div>
  </body>
</html>
